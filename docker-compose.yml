services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: ${API_PREFIX:-/api}
      MONGODB_URI: mongodb://mongo:27017/${MONGO_DATABASE:-webdl}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3100}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:3101}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3100}
      EXTRA_CORS_ORIGINS: ${EXTRA_CORS_ORIGINS:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in root .env}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_DAYS: ${JWT_REFRESH_EXPIRES_DAYS:-30}
      ADMIN_SETUP_KEY: ${ADMIN_SETUP_KEY:-}
      ASSET_BASE_URL: ${ASSET_BASE_URL:-}
    ports:
      - "${API_PORT:-5000}:5000"
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: ./client_web
      args:
        REACT_APP_API_URL: /api
        REACT_APP_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3100}
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3100}:80"
    depends_on:
      - api

  admin:
    build:
      context: ./admin_web
      args:
        VITE_API_URL: /api
        VITE_STOREFRONT_URL: ${PUBLIC_SITE_URL:-http://localhost:3100}
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3101}:80"
    depends_on:
      - api

volumes:
  mongo_data:
